<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finances</title>
    <link rel="icon" type="image/x-icon" href="images/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/global.css">
</head>
<body>
    
    <!--Colors:
    #FFFFFF
    #1B2A4A
    #3B82F6
    -->
    <div class="d-flex min-vh-100">
        <aside class="text-white p-3 d-flex flex-column" style="width:250px; background-color:#1B2A4A;">
            <!--LOGO-->
            <div class="mb-4">
                <img src="images/logo-model-2.png" style="width:auto; max-width:150px; padding:5px;">
            </div>
            
            
            <!-- Navigation Menu-->
            <ul class="nav nav-pills flex-column gap-2">
                <li class="nav-item">
                    <a href="dashboard.html" class="nav-link text-white-50 d-flex align-items-center gap-2">
                        <img src="images/layout-dashboard.png"> Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link active bg-primary text-white d-flex align-items-center gap-2">
                        <img src="images/dollar-sign.png"> Finances
                    </a>
                </li>
                <li class="nav-item">
                    <a href="goals.html" class="nav-link text-white-50 d-flex align-items-center gap-2">
                        <img src="images/target.png"> Goals
                    </a>
                </li>
                <li class="nav-item">
                    <a href="reports.html" class="nav-link text-white-50 d-flex align-items-center gap-2">
                        <img src="images/trending-up.png"> Reports
                    </a>
                </li>
            </ul>
        </aside>
        
        
        <main class="flex-grow-1 d-flex flex-column">
            <header class="bg-white p-3 border-bottom d-flex justify-content-between align-items-center px-4">
                <span class="fw-semibold text-dark fs-5">Hello, Antonio!</span>
                <div class="d-flex align-items-center gap-3">
                    <button class="btn btn-light rounded-circle border-0"><i class="bi bi-bell"></i> </button>
                    <div class="bg-secondary rounded-circle" style="width:35px; height:35px;"></div>
                </div>
            </header>

            <div id="viewFinancas" class="p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3 class="fw-bold text-dark m-0">
                        My finances
                    </h3>
                    <button id="btnOpenNewRecord" class="btn btn-primary d-flex align-items-center gap-2 fw-medium px-3 py-2">
                        <i class="bi bi-plus-lg"></i> New Record
                    </button>
                </div>
            </div>

            <!-- Filtros de Busca-->
            <div class="card border-0 shadow-sm mb-4 p-2">
                <div class="card-body p-2 d-flex gap-3 align-items-center">
                    <div class="dropdown">
                        <button class="btn btn-outline-secondary dropdown-toggle border-0 fw-medium" type="button" data-bs-toggle="dropdown">
                            This month
                        </button> 
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#">This month</a></li>
                            <li><a class="dropdown-item" href="#">This year</a></li>
                            <li><a class="dropdown-item" href="#">Whole period</a></li>
                        </ul>
                    </div>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-0 text-muted"><i class="bi bi-search"></i> </span>
                        <input type="text" class="form-control border-0 bg-transparent ps-0" placeholder="Search transactions...">
                    </div>
                </div>
            </div>

            <!-- TABLE -->
            



        </main>
    </div>


    <script src="js/signup.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
