
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Goals - Cx Finance</title>

    <link rel="icon" type="image/x-icon" href="/images/logo.png">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">

    <link rel="stylesheet" href="/css/global.css">
</head>

<body>

<div class="d-flex min-vh-100">

    <div th:replace="~{fragments/sidebar :: sidebar('goals')}"></div>

    <main class="flex-grow-1 d-flex flex-column">

        <!-- HEADER -->
        <header class="bg-white p-3 border-bottom d-flex
                       justify-content-between align-items-center px-4">

            <span class="fw-semibold text-dark fs-5">
                Hello, Antonio!
            </span>

            <div class="d-flex align-items-center gap-3">
                <button class="btn btn-light rounded-circle border-0"
                        type="button"
                        aria-label="Notifications">
                    <i class="bi bi-bell"></i>
                </button>

                <div class="bg-secondary rounded-circle"
                     style="width: 35px; height: 35px;">
                </div>
            </div>
        </header>

        <!-- MAIN CONTENT -->
        <section class="p-4">

            <div class="d-flex flex-wrap justify-content-between
                        align-items-center gap-3 mb-3">

                <h3 class="fw-bold text-dark m-0">
                    My goals
                </h3>

                <a href="/new-goal"
                   id="btnNovaMeta"
                   class="btn btn-primary d-flex align-items-center
                          gap-2 fw-medium px-3 py-2">

                    <i class="bi bi-plus-lg"></i>
                    New Goal
                </a>
            </div>

            <p class="text-muted small mb-4">
                Define your objectives and track your progress.
            </p>

            <!-- LOADING -->
            <div id="carregandoMetas"
                 class="text-center py-5">

                <div class="spinner-border text-primary"
                     role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>

                <p class="text-muted mt-3 mb-0">
                    Loading your goals...
                </p>
            </div>

            <!-- ERROR / FEEDBACK -->
            <div id="mensagemMetas"
                 class="alert d-none"
                 role="alert">
            </div>

            <!-- EMPTY STATE -->
            <div id="metasVazias"
                 class="card border-0 shadow-sm text-center p-5 d-none">

                <div class="mb-3">
                    <i class="bi bi-bullseye text-primary"
                       style="font-size: 2.5rem;"></i>
                </div>

                <h5 class="fw-bold text-dark">
                    No goals yet
                </h5>

                <p class="text-muted mb-3">
                    Create your first goal and start tracking your progress.
                </p>

                <div>
                    <a href="/new-goal"
                       class="btn btn-primary">
                        <i class="bi bi-plus-lg me-1"></i>
                        Create my first goal
                    </a>
                </div>
            </div>

            <!-- DYNAMIC GOAL CARDS -->
            <div id="listaMetas"
                 class="d-flex flex-column gap-3">
            </div>

        </section>

    </main>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="/js/goals.js"></script>
<script src="/js/logout.js"></script>

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous">
</script>

</body>
</html>
