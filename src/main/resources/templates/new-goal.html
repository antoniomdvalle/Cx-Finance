<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Meta - Cx Finance</title>
    <link rel="icon" type="image/x-icon" href="images/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/global.css">
    <style>
        /* Estilos complementares do layout interno */
        body {
            background-color: #f8f9fa;
        }
        .sidebar {
            width: 260px;
            background-color: #121d33;
            min-height: 100vh;
        }
        .sidebar .nav-link {
            color: #a0aec0;
            border-radius: 8px;
            margin-bottom: 5px;
        }
        .sidebar .nav-link:hover {
            color: #fff;
            background-color: rgba(255, 255, 255, 0.1);
        }
        .sidebar .nav-link.active {
            color: #fff;
            background-color: #3b82f6;
        }
    </style>
</head>
<body class="d-flex">

    <!-- SIDEBAR (MENU LATERAL) -->
    <div th:replace="fragments/sidebar :: sidebar('reports')"></div>

    <!-- CONTEÚDO PRINCIPAL -->
    <div class="flex-grow-1 d-flex flex-column">
        
        <!-- HEADER (CABEÇALHO) -->
        <header class="bg-white border-bottom px-4 py-3 d-flex justify-content-end align-items-center gap-3">
            <span class="fw-semibold text-dark">Olá, Antonio!</span>
            <div class="border rounded-circle p-2 d-flex align-items-center justify-content-center bg-light" style="width: 40px; height: 40px; cursor: pointer;">
                🔔
            </div>
            <div class="bg-secondary rounded-circle" style="width: 40px; height: 40px;"></div>
        </header>

        <!-- CORPO DA PÁGINA / FORMULÁRIO -->
        <main class="p-4 flex-grow-1">
            <div class="container-fluid" style="max-width: 900px;">
                
                <!-- Botão de voltar -->
                <a href="#" class="text-decoration-none text-primary fw-semibold mb-3 d-inline-block">&larr; Voltar para minhas metas</a>

                <h2 class="fw-bold text-dark">Nova meta</h2>
                <p class="text-muted mb-4">Defina seu próximo objetivo e comece a planejar como alcançá-lo.</p>

                <!-- CARD DO FORMULÁRIO -->
                <div class="card border rounded-4 p-4 shadow-sm bg-white">
                    <form action="/api/metas" method="POST">
                        
                        <!-- Nome da meta -->
                        <div class="mb-3">
                            <label for="txtNomeMeta" class="form-label fw-semibold">Nome da meta <span class="text-danger">*</span></label>
                            <input type="text" name="nomeMeta" class="form-control form-control-lg fs-6" id="txtNomeMeta" placeholder="Ex.: Viagem dos sonhos" required>
                        </div>

                        <!-- Valores lado a lado (Grid Bootstrap) -->
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="txtValorObjetivo" class="form-label fw-semibold">Valor objetivo <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white text-muted">R$</span>
                                    <input type="text" name="valorObjetivo" class="form-control form-control-lg fs-6" id="txtValorObjetivo" placeholder="0,00" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label for="txtValorGuardado" class="form-label fw-semibold">Valor já guardado <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white text-muted">R$</span>
                                    <input type="text" name="valorGuardado" class="form-control form-control-lg fs-6" id="txtValorGuardado" placeholder="0,00" required>
                                </div>
                                <div class="form-text small text-muted mt-1">Se ainda não começou, deixe o valor em R$ 0,00.</div>
                            </div>
                        </div>

                        <!-- Prazo -->
                        <div class="mb-3">
                            <label for="txtPrazo" class="form-label fw-semibold">Prazo <span class="text-danger">*</span></label>
                            <input type="text" name="prazo" class="form-control form-control-lg fs-6" id="txtPrazo" placeholder="dd/mm/aaaa" required>
                            <div class="form-text small text-muted mt-1">Escolha a data em que deseja alcançar sua meta.</div>
                        </div>

                        <!-- Descrição -->
                        <div class="mb-4">
                            <label for="txtDescricao" class="form-label fw-semibold">Descrição <span class="text-muted fw-normal">(opcional)</span></label>
                            <textarea name="descricao" class="form-control fs-6" id="txtDescricao" rows="4" placeholder="Conte um pouco sobre sua meta e o que ela representa para você."></textarea>
                        </div>

                        <!-- Rodapé do Card (Botões e Aviso) -->
                        <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                            <span class="text-muted small">* Campos obrigatórios</span>
                            <div class="d-flex gap-2">
                                <a href="#" class="btn btn-outline-secondary px-4 fw-semibold text-dark">Cancelar</a>
                                <button type="submit" class="btn btn-primary px-4 fw-semibold">Criar meta</button>
                            </div>
                        </div>

                    </form>
                </div>

            </div>
        </main>
    </div>
    <script src="/js/logout.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
