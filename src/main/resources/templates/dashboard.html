<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Cx Finance</title>
    <link rel="icon" type="image/x-icon" href="images/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/global.css">
</head>
<body>
    <!--Colors:
    #FFFFFF
    #1B2A4A
    #3B82F6
    -->
    <div class="d-flex min-vh-100">
        <aside class="text-white p-3 d-flex flex-column" style="width:250px; background-color:#1B2A4A;">
            <!--LOGO-->
            <div class="mb-4">
                <img src="images/logo-model-2.png" style="width:auto; max-width:150px; padding:5px;">
            </div>
            
            
            <!-- Navigation Menu-->
            <ul class="nav nav-pills flex-column gap-2">
                <li class="nav-item">
                    <a href="#" class="nav-link active bg-primary text-white d-flex align-items-center gap-2">
                        <img src="images/layout-dashboard.png"> Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a href="finances.html" class="nav-link text-white-50 d-flex align-items-center gap-2">
                        <img src="images/dollar-sign.png"> Finances
                    </a>
                </li>
                <li class="nav-item">
                    <a href="goals.html" class="nav-link text-white-50 d-flex align-items-center gap-2">
                        <img src="images/target.png"> Goals
                    </a>
                </li>
                <li class="nav-item">
                    <a href="reports.html" class="nav-link text-white-50 d-flex align-items-center gap-2">
                        <img src="images/trending-up.png"> Reports
                    </a>
                </li>
            </ul>
        </aside>

        <main class="flex-grow-1 d-flex flex-column">
            <header class="bg-white p-3 border-bottom d-flex justify-content-between align-items-center px-4">
                <span class="fw-semibold text-dark fs-5">Hello, Antonio!</span>
                <div class="d-flex align-items-center gap-3">
                    <button class="btn btn-light rounded-circle border-0"><i class="bi bi-bell"></i> </button>
                    <div class="bg-secondary rounded-circle" style="width:35px; height:35px;"></div>
                </div>
            </header>

            <!-- DASHBOARD -->
            <div class="p-4">
                <h3 class="fw-bold mb-4 text-dark"> Overview </h3>
                <!-- Card line -->
                <div class="row g-3 mb-4">
                    <!-- income CARD-->
                    <div class="col-md-4">
                        <div class="card p-3 border-0 border-start border-4 border-success shadow-sm">
                            <small class="text-muted fw-bold text-uppercase">income</small>
                            <h3 class="fw-bold text-dark m-0 mt-1">R$3.850,00</h3>
                        </div>
                    </div>
                    <!-- expense CARD-->
                    <div class="col-md-4">
                        <div class="card p-3 border-0 border-start border-4 border-danger shadow-sm">
                            <small class="text-muted fw-bold text-uppercase">expenses</small>
                            <h3 class="fw-bold text-dark m-0 mt-1">R$2.340,00</h3>
                        </div>
                    </div>
                    <!-- balance CARD-->
                    <div class="col-md-4">
                        <div class="card p-3 border-0 border-start border-4 border-primary shadow-sm">
                            <small class="text-muted fw-bold text-uppercase">balance</small>
                            <h3 class="fw-bold text-dark m-0 mt-1">R$1.510,00</h3>
                        </div>
                    </div>
                </div>

                <!-- GRAPHIC -->
                 <div class="card p-4 border-0 shadow-sm">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h6 class="fw-bold m-0 text-dark"> Income X Expenses</h6>
                        <small class="text-muted"> Past 6 months</small>
                    </div>
                    <!-- GRAPHIC PLACEHOLDER -->
                     <div class="bg-light rounded p-5 text-center text-muted border">
                        [ Bar Graphic ]
                     </div>
                 </div>

            </div>
        </main>

    </div>





    <script src="js/signup.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
