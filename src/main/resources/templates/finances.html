<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finances</title>
    <link rel="icon" type="image/x-icon" href="images/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/global.css">
</head>
<body>
    
    <!--Colors:
    #FFFFFF
    #1B2A4A
    #3B82F6
    -->
    <div class="d-flex min-vh-100">
        <div th:replace="fragments/sidebar :: sidebar('finances')"></div>
        
        
        <main class="flex-grow-1 d-flex flex-column">
            <header class="bg-white p-3 border-bottom d-flex justify-content-between align-items-center px-4">
                <span class="fw-semibold text-dark fs-5">Hello, Antonio!</span>
                <div class="d-flex align-items-center gap-3">
                    <button class="btn btn-light rounded-circle border-0"><i class="bi bi-bell"></i> </button>
                    <div class="bg-secondary rounded-circle" style="width:35px; height:35px;"></div>
                </div>
            </header>

            <div id="viewFinances" class="p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3 class="fw-bold text-dark m-0">
                        My finances
                    </h3>
                    <button id="btnOpenNewRecord" class="btn btn-primary d-flex align-items-center gap-2 fw-medium px-3 py-2">
                        <i class="bi bi-plus-lg"></i> New Record
                    </button>
                </div>
            

                <!-- Filtros de Busca -->
                <div class="card border-0 shadow-sm mb-4 p-2">
                    <div class="card-body p-2 d-flex gap-3 align-items-center">

                        <!-- Filtro de período -->
                        <div class="dropdown">
                            <button
                                id="btnFiltroPeriodo"
                                class="btn btn-outline-secondary dropdown-toggle border-0 fw-medium"
                                type="button"
                                data-bs-toggle="dropdown"
                                aria-expanded="false">
                                Whole period
                            </button>

                            <ul class="dropdown-menu" id="filtroPeriodo">
                                <li>
                                    <a class="dropdown-item" href="#" data-periodo="mes">
                                        Last 30 days
                                    </a>
                                </li>
                                <li>
                                    <a class="dropdown-item" href="#" data-periodo="ano">
                                        This year
                                    </a>
                                </li>
                                <li>
                                    <a class="dropdown-item active" href="#" data-periodo="todos">
                                        Whole period
                                    </a>
                                </li>
                            </ul>
                        </div>

                        <!-- Busca por descrição ou categoria -->
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-0 text-muted">
                                <i class="bi bi-search"></i>
                            </span>

                            <input
                                type="text"
                                id="buscaRegistros"
                                class="form-control border-0 bg-transparent ps-0"
                                placeholder="Search transactions..."
                                autocomplete="off">
                        </div>

                    </div>
                </div>

                <!-- TABLE -->
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr class="text-secondary small fw-semibold">
                                        <th class="ps-4">Date</th>
                                        <th>Description</th>
                                        <th>Cathegory</th>
                                        <th>Type</th>
                                        <th>Value</th>
                                        <th class="text-end pe-4">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="tabelaRegistros">
                                    <tr>
                                        <td colspan="6" class="text-center text-muted py-4">
                                            Carregando registros...
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                    <!-- Pagination is not going to be added -->
                </div>
            </div>

            <div id="viewNewRecord" class="p-4 d-flex justify-content-center align-items-center flex-grow-1 d-none">
                <div class="card border-0 shadow-sm p-4" style="max-width: 600px; width: 100%;">
                    <div class="mb-4">
                        <h4 class="fw-bold text-dark m-0">
                            New financial record
                        </h4>
                        <small class="text-muted">Fill the data below to catalog a new record:</small>
                    </div>
                    <form id="formNewRecord">
                        <input
                            type="radio"
                            class="btn-check"
                            name="tipo"
                            id="typeIncome"
                            value="ENTRADA"
                            checked
                            required
                        >

                        <label class="btn btn-outline-primary rounded fw-medium"
                            for="typeIncome">
                            Entrada
                        </label>

                        <input
                            type="radio"
                            class="btn-check"
                            name="tipo"
                            id="typeExpense"
                            value="SAIDA"
                            required
                        >

                        <label class="btn btn-outline-primary rounded fw-medium"
                            for="typeExpense">
                            Saída
                        </label>
                        <!-- Valor -->
                        <input
                            type="number"
                            class="form-control form-control-lg fs-6"
                            id="recordAmount"
                            min="0.01"
                            step="0.01"
                            placeholder="0.00"
                            required
                        >
                        <!-- Date -->
                        <div class="mb-3">
                            <label for="recordDate" class="form-label text-secondary fw-semibold small">Date</label>
                            <input type="date" class="form-control" id="recordDate" required>
                        </div>
                        <!-- Cathegory -->
                        <div class="mb-3">
                            <label for="recordCathegory" class="form-label text-secondary fw-semibold small">Cathegory</label>
                            <select class="form-select" id="recordCathegory" required>
                                <option value="" selected disabled>Select one cathegory</option>
                                <option value="Trabalho">Work</option>
                                <option value="Alimentação">Food</option>
                                <option value="Moradia">Housing</option>
                                <option value="Lazer">Fun</option>
                            </select>
                        </div>
                        <!-- Descrição -->
                        <textarea
                            class="form-control form-control-lg fs-6"
                            rows="3"
                            id="recordDescription"
                            placeholder="Stocks, revenue shares, grocery store..."
                            required
                        ></textarea>
                        <!-- Submit -->
                        <div class="d-flex justify-content-end gap-2">
                            <button type="button" id="btnCancelRecord" class="btn btn-outline-secondary px-4">Cancel</button>
                            <button type="submit" class="btn btn-primary px-4">Save</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/finances.js"></script>
    <script src="/js/logout.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
