<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup - Cx Finance</title>
    <!-- Ícone -->
    <link rel="icon" type="image/x-icon" th:href="@{/images/logo.png}">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Seu CSS Global -->
    <link rel="stylesheet" th:href="@{/css/global.css}">
</head>
<body class="d-flex justify-content-center align-items-center min-vh-100">

    <div class="card p-4 shadow-sm border rounded-4" style="width:100%; max-width:400px;">
        <div class="text-center mb-4">
            <div class="d-flex align-items-center justify-content-center gap-2 mb-2">
                <!-- Imagem com Thymeleaf -->
                <img th:src="@{/images/logo.png}" alt="Logo" width="40">
                <h4 class="fw-bold m-0 text-dark">Cx Finance</h4>
            </div>
            <p class="text-muted small mb-4">We manage your money for you.</p>
            <h3 class="fw-bold text-dark">Hey you!</h3>
        </div>

        <!-- Mude a Action e o Method -->
        <form id="signupForm" action="/api/signup" method="POST">
            
            <!-- Adicione name="name" no input -->
            <div class="mb-3 text-start">
                <label for="txtName" class="form-label fw-semibold">Full Name</label>
                <input type="text" name="name" class="form-control form-control-lg fs-6" id="txtName" placeholder="Anthony Davis" required>
            </div>
            
            <!-- Adicione name="email" no input -->
            <div class="mb-3 text-start">
                <label for="txtEmail" class="form-label fw-semibold">Email</label>
                <input type="email" name="email" class="form-control form-control-lg fs-6" id="txtEmail" placeholder="youremail@email.com" required>
            </div>
            
            <!-- Adicione name="password" no input -->
            <div class="mb-2 text-start">
                <label for="txtPassword" class="form-label fw-semibold">Password</label>
                <input type="password" name="password" class="form-control form-control-lg fs-6 border-end-0" id="txtPassword" placeholder="********" required minlength="6">
            </div>
             <!-- password checker -->
              <div class="mb-2 text-start">
                <label for="txtPasswordCheck" class="form-label fw-semibold">Password Confirmation</label>
                <input type="password" class="form-control form-control-lg fs-6 border-end-0" id="txtPasswordCheck" placeholder="********" required>
              </div>

              <div class="form-check mb-4 text-start">
                <input class="form-check-input" type="checkbox" id="chkTerms">
                <label class="form-check-label small" for="chkTerms">
                    I read and agree with the <a href="#" class="text-primary text-decoration-none">Service Terms</a>.
                </label>
              </div> 

               <!-- SIGNUP button  -->
                <button type="submit" id="btnSubmit" class="btn btn-primary w-100 py-2 fw-semibold" disabled>Signup</button>
              
                <!-- LOGIN button -->
               <div class="text-center mb-4">
                <span class="text-muted small fw-semibold">Already an user?</span>
                <a href="index.html" class="text-decoration-none small text-primary fw-semibold">Login now.</a>
               </div>
        
        </form>
    </div>

    <!-- Scripts com Thymeleaf -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/signup.js}"></script>
</body>
</html>
